name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The encoder's tensor layer and model are tested too. The CPU build of
      # torch is a fraction of the default CUDA one and needs no GPU; it is
      # installed first so the package install does not pull the CUDA wheel.
      - name: Install CPU-only torch
        run: pip install torch numpy --index-url https://download.pytorch.org/whl/cpu

      - name: Install the package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      - name: Run the tests
        run: pytest

      # A fresh database must pass every invariant it ships with. This
      # catches a schema change that quietly breaks a check - the tests use
      # hand-built rows, this uses the schema as it actually ships.
      - name: Check a fresh database
        run: elenchus --db "$RUNNER_TEMP/ci.db" check
