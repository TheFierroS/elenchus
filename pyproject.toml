# Project identity, dependencies, and tool configuration.
# https://packaging.python.org/en/latest/specifications/pyproject-toml/

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elenchus"
version = "0.6.0"
description = "A refutation-driven agent for reverse engineering: it proposes claims about a binary and keeps only the ones it cannot refute."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "TheFierroS" }]
keywords = [
    "reverse-engineering",
    "ghidra",
    "binary-analysis",
    "machine-learning",
    "event-sourcing",
]

# Runtime dependencies needed just to scan a binary and query the database.
# Ghidra itself is not a pip package: it is installed separately and found
# through GHIDRA_INSTALL_DIR. pyghidra is the bridge to it.
dependencies = [
    "pyghidra>=3.0",
    "pefile>=2023.2.7",
    "pyelftools>=0.31",
]

[project.optional-dependencies]
# Everything needed to develop on elenchus, but not to run it.
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

# The model side: encoder training. Kept separate so a user who only wants to
# scan binaries is not forced to install a deep-learning stack. Floors are the
# versions week 6 was developed on; torch 2.14 is the first with cp314 wheels
# confirmed working here. Its default wheel targets CUDA 13, which needs an
# NVIDIA driver new enough to report CUDA 13 in nvidia-smi.
ml = [
    "torch>=2.14",
    "numpy>=2.5",
]

# The verifier side: emulating a function to test a proposed identity. Unicorn
# is a CPU emulator built on QEMU that runs x86-64 with no operating system
# and lets memory and calls be intercepted, which is what the harness needs.
# Kept separate like the model side, so scanning does not pull it in.
verify = [
    "unicorn>=2.1",
    # Decoding the compare that set the flags is what dynamic selectivity
    # needs, and a conditional jump's target is what forcing one needs
    # (docs/verifier.md, two tiers). Only used when predicate recording is
    # asked for, so an ordinary run never pays for it.
    "capstone>=5.0",
]

[project.scripts]
# Makes `elenchus ...` work as a command once the package is installed,
# instead of only `python -m elenchus`.
elenchus = "elenchus.cli:main"

[project.urls]
Repository = "https://github.com/TheFierroS/elenchus"

[tool.setuptools.packages.find]
# Ship the elenchus package; leave docs, tests, and scratch out of the wheel.
include = ["elenchus*"]

[tool.ruff]
# Ruff is the linter and formatter. Keep the line length generous enough for
# the SQL strings in db.py without forcing awkward wraps.
line-length = 90
target-version = "py311"

[tool.ruff.lint]
# A pragmatic starter set: pyflakes (F) catches real bugs like unused or
# undefined names, pycodestyle (E, W) enforces style, isort (I) keeps imports
# ordered, and pyupgrade (UP) flags outdated syntax.
select = ["E", "W", "F", "I", "UP"]

[tool.pytest.ini_options]
# Tests live in tests/. addopts keeps output quiet but shows a short summary
# of anything that is not a plain pass.
testpaths = ["tests"]
addopts = "-ra -q"
