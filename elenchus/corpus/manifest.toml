# ---------------- previously failed, cause found ----------------
# Three of these failed for one reason: the old schema could only look in the
# source root or in src/, and they keep their sources in lib/. The fourth was
# missing an exclude.

[[package]]
name = "lz4"
domain = "compression"
version = "1.10.0"
url = "https://github.com/lz4/lz4/archive/refs/tags/v1.10.0.tar.gz"
license = "BSD-2-Clause"
sources = ["lib/*.c"]

[[package]]
name = "libbase64"
domain = "text"
version = "0.5.2"
url = "https://github.com/aklomp/base64/archive/refs/tags/v0.5.2.tar.gz"
license = "BSD-2-Clause"
# Named rather than globbed. Everything else under arch/generic is a fragment
# codec.c includes into the middle of a function, and table_generator.c is a
# build-time tool rather than part of the library. Every arch/*/codec.c is
# compiled, not just the generic one: codec_choose.c references all of them,
# and with the HAVE_* switches below off each one compiles to a stub. Leaving
# them out was the last link failure.
sources = ["lib/lib.c", "lib/codec_choose.c", "lib/arch/*/codec.c",
           "lib/tables/tables.c"]
include_dirs = ["include", "lib"]
defines = ["BASE64_STATIC_DEFINE"]   # its header declares the API dllimport
# cmake normally generates this, switching SIMD codecs on per machine. All
# off: the generic codec is the one worth learning, and per-machine SIMD
# would make the corpus depend on which laptop built it.
create = [["lib/config.h", "#ifndef BASE64_CONFIG_H\n#define BASE64_CONFIG_H\n#define HAVE_SSSE3 0\n#define HAVE_SSE41 0\n#define HAVE_SSE42 0\n#define HAVE_AVX 0\n#define HAVE_AVX2 0\n#define HAVE_AVX512 0\n#define HAVE_NEON32 0\n#define HAVE_NEON64 0\n#endif\n"]]

