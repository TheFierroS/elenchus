# Corpus package manifest.
#
# Each package is an open-source C library we compile ourselves, so the
# compiler can write down the ground truth (real names, signatures, types)
# that the encoder trains on and the agent is measured against. Only source
# we can legally recompile belongs here; targets to analyse do not.
#
# A "style" names how the package builds. Optional preparation covers the
# common reasons a plain compile fails, so the manifest stays thin: adding a
# package is usually a URL and a style.
#
#   style   = "c_glob"      compile every .c in the source root
#   style   = "c_glob_src"  same, but sources live under src/
#   exclude = [...]         .c files to skip (own main, or an amalgamation
#                           that re-includes the rest - both duplicate symbols)
#   copy    = [[from, to]]  put a prebuilt config header in place
#   create  = [[name, text] write a header the build system would generate

[[package]]
name = "zlib"
version = "1.3.1"
url = "https://github.com/madler/zlib/archive/refs/tags/v1.3.1.tar.gz"
license = "Zlib"
style = "c_glob"
# General-purpose compression. Small, self-contained, no configure step.

[[package]]
name = "cjson"
version = "1.7.18"
url = "https://github.com/DaveGamble/cJSON/archive/refs/tags/v1.7.18.tar.gz"
license = "MIT"
style = "c_glob"
# A small JSON parser: one cJSON.c plus a header.

[[package]]
name = "miniz"
version = "3.0.2"
url = "https://github.com/richgel999/miniz/archive/refs/tags/3.0.2.tar.gz"
license = "MIT"
style = "c_glob"
# A single-file zlib alternative. Its build normally generates miniz_export.h,
# an export-visibility macro we do not need; an empty define satisfies it.
create = [["miniz_export.h", "#define MINIZ_EXPORT\n"]]
exclude = ["example1.c", "example2.c", "example3.c", "example4.c", "example5.c", "example6.c"]

[[package]]
name = "lua"
version = "5.4.7"
url = "https://github.com/lua/lua/archive/refs/tags/v5.4.7.tar.gz"
license = "MIT"
style = "c_glob"
# A scripting language: VM, parser, GC - a wide variety of function shapes.
# lua.c and luac.c carry main; onelua.c is a one-file amalgamation that
# re-includes every other source; ltests.c is an internal test harness.
exclude = ["lua.c", "luac.c", "onelua.c", "ltests.c"]

# libpng: needs zlib's headers at compile time. Deferred until the manifest
# supports inter-package dependencies; the pipeline is proven without it.
