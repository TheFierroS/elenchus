# ---------------- previously failed, cause found ----------------
# Three of these failed for one reason: the old schema could only look in the
# source root or in src/, and they keep their sources in lib/. The fourth was
# missing an exclude.

[[package]]
name = "lz4"
version = "1.10.0"
url = "https://github.com/lz4/lz4/archive/refs/tags/v1.10.0.tar.gz"
license = "BSD-2-Clause"
sources = ["lib/*.c"]

[[package]]
name = "libbase64"
version = "0.5.2"
url = "https://github.com/aklomp/base64/archive/refs/tags/v0.5.2.tar.gz"
license = "BSD-2-Clause"
sources = ["lib/*.c", "lib/arch/generic/*.c", "lib/tables/*.c"]
include_dirs = ["include", "lib"]
exclude = ["lib_openmp.c"]
# cmake normally generates this, switching SIMD codecs on per machine. All
# off: the generic codec is the one worth learning, and per-machine SIMD
# would make the corpus depend on which laptop built it.
create = [["lib/config.h", "#ifndef BASE64_CONFIG_H\n#define BASE64_CONFIG_H\n#define HAVE_SSSE3 0\n#define HAVE_SSE41 0\n#define HAVE_SSE42 0\n#define HAVE_AVX 0\n#define HAVE_AVX2 0\n#define HAVE_AVX512 0\n#define HAVE_NEON32 0\n#define HAVE_NEON64 0\n#endif\n"]]

[[package]]
name = "heatshrink"
version = "0.4.1"
url = "https://github.com/atomicobject/heatshrink/archive/refs/tags/v0.4.1.tar.gz"
license = "ISC"
sources = ["heatshrink_*.c"]

# ---------------- compression ----------------

[[package]]
name = "zstd"
version = "1.5.6"
url = "https://github.com/facebook/zstd/archive/refs/tags/v1.5.6.tar.gz"
license = "BSD-3-Clause"
sources = ["lib/common/*.c", "lib/compress/*.c", "lib/decompress/*.c", "lib/dictBuilder/*.c"]
include_dirs = ["lib", "lib/common"]
defines = ["ZSTD_DISABLE_ASM=1"]

[[package]]
name = "libdeflate"
version = "1.20"
url = "https://github.com/ebiggers/libdeflate/archive/refs/tags/v1.20.tar.gz"
license = "MIT"
sources = ["lib/*.c", "lib/x86/*.c"]
include_dirs = ["."]

[[package]]
name = "xxhash"
version = "0.8.2"
url = "https://github.com/Cyan4973/xxHash/archive/refs/tags/v0.8.2.tar.gz"
license = "BSD-2-Clause"
sources = ["xxhash.c"]

# ---------------- cryptography ----------------
# The most valuable entry here. Cryptographic primitives are what reverse
# engineering most often needs to identify, and their shapes are distinctive
# enough that an encoder either learns them or plainly does not.

[[package]]
name = "mbedtls"
version = "3.6.0"
url = "https://github.com/Mbed-TLS/mbedtls/archive/refs/tags/v3.6.0.tar.gz"
license = "Apache-2.0"
sources = ["library/*.c"]
include_dirs = ["include", "library"]
libs = ["advapi32", "bcrypt"]   # entropy comes from the Windows crypto API

# ---------------- parsing and text ----------------

[[package]]
name = "libexpat"
version = "2.6.2"
url = "https://github.com/libexpat/libexpat/archive/refs/tags/R_2_6_2.tar.gz"
license = "MIT"
sources = ["expat/lib/*.c"]
include_dirs = ["expat/lib", "expat"]
exclude = ["xmltok_impl.c", "xmltok_ns.c"]
create = [["expat/lib/expat_config.h", "#define XML_CONTEXT_BYTES 1024\n#define XML_DTD 1\n#define XML_GE 1\n#define XML_NS 1\n#define HAVE_MEMMOVE 1\n#define PACKAGE_VERSION \"2.6.2\"\n"]]

[[package]]
name = "libyaml"
version = "0.2.5"
url = "https://github.com/yaml/libyaml/archive/refs/tags/0.2.5.tar.gz"
license = "MIT"
sources = ["src/*.c"]
include_dirs = ["include", "src"]
defines = ["HAVE_CONFIG_H=1"]   # without it the header below is skipped entirely
create = [["src/config.h", "#define YAML_VERSION_MAJOR 0\n#define YAML_VERSION_MINOR 2\n#define YAML_VERSION_PATCH 5\n#define YAML_VERSION_STRING \"0.2.5\"\n"]]

[[package]]
name = "jansson"
version = "2.14"
url = "https://github.com/akheron/jansson/archive/refs/tags/v2.14.tar.gz"
license = "MIT"
sources = ["src/*.c"]
include_dirs = ["src"]
defines = ["HAVE_STDINT_H=1", "JSON_PARSER_MAX_DEPTH=2048"]
# The shipped .h.in is a template full of @placeholders@, not valid C, so
# copying it was never going to work. These are the values its build system
# would have substituted.
create = [
  ["src/jansson_config.h", "#ifndef JANSSON_CONFIG_H\n#define JANSSON_CONFIG_H\n#define JSON_INLINE inline\n#define JSON_INTEGER_IS_LONG_LONG 1\n#define JSON_HAVE_LOCALECONV 1\n#define JSON_HAVE_ATOMIC_BUILTINS 1\n#define JSON_HAVE_SYNC_BUILTINS 1\n#endif\n"],
  ["src/jansson_private_config.h", "#define HAVE_STDINT_H 1\n#define HAVE_SNPRINTF 1\n#define HAVE_VSNPRINTF 1\n#define INITIAL_HASHTABLE_ORDER 3\n"],
]

