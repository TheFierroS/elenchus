# Corpus package manifest.
#
# Each package is an open-source C library we compile ourselves, so the
# compiler can write down the ground truth (real names, signatures, types)
# that the encoder trains on and the agent is measured against. Only source
# we can legally recompile belongs here; targets to analyse do not.
#
# Fields:
#
#   sources      = ["lib/*.c"]     glob patterns, relative to the source root
#   include_dirs = ["include"]     added as -I
#   defines      = ["NO_SSL"]      added as -D
#   exclude      = ["test.c"]      .c files to skip, matched by name
#   copy         = [[from, to]]    put a prebuilt config header in place
#   create       = [[name, text]]  write a header the build system generates
#
# Two things commonly make a package fail, and both are worth knowing when
# adding one. A source file carrying its own main() is harmless in a shared
# library but fills the ground truth with test-harness functions, so exclude
# it. A source file that another one #includes must be excluded, or every
# symbol in it is defined twice.
#
# Diversity matters more than count. An encoder trained only on compressors
# learns compressors. The mix below is deliberate: compression, parsing,
# cryptography, text processing, networking, paths and logging.
#
# Packages marked verified have compiled and matched ground truth at 99-100%
# across -O0..-O3. The rest have had their layout checked against the real
# tarball but not their compile; build-corpus skips failures and reports
# them, so an unbuildable candidate costs one line in a log.

# ---------------- verified ----------------

[[package]]
name = "zlib"
version = "1.3.1"
url = "https://github.com/madler/zlib/archive/refs/tags/v1.3.1.tar.gz"
license = "Zlib"
sources = ["*.c"]

