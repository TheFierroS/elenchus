[[package]]
name = "json-c"
domain = "data-format"
version = "0.19-20260627"
url = "https://github.com/json-c/json-c/archive/refs/tags/json-c-0.19-20260627.tar.gz"
license = "MIT"
# JSON, a design unlike cJSON and jansson. CMake generates three headers.
sources = ["*.c"]   # (~186 at >= 2 levels, sandbox)
include_dirs = ["."]
# config.h: what MinGW has (STDC_HEADERS makes arraylist.c include stdlib.h;
# long is 4 bytes on Win64); json.h lists the public headers
create = [["json_config.h", "#define JSON_C_HAVE_INTTYPES_H 1\n"], ["config.h", "#define STDC_HEADERS 1\n#define HAVE_STDARG_H 1\n#define HAVE_STDLIB_H 1\n#define HAVE_STRING_H 1\n#define HAVE_INTTYPES_H 1\n#define HAVE_STDINT_H 1\n#define HAVE_LIMITS_H 1\n#define HAVE_LOCALE_H 1\n#define HAVE_SETLOCALE 1\n#define HAVE_SNPRINTF 1\n#define HAVE_VSNPRINTF 1\n#define HAVE_VPRINTF 1\n#define HAVE_STRDUP 1\n#define HAVE_STRERROR 1\n#define HAVE_STRTOLL 1\n#define HAVE_STRTOULL 1\n#define HAVE_REALLOC 1\n#define HAVE_OPEN 1\n#define HAVE_FCNTL_H 1\n#define HAVE_SYS_STAT_H 1\n#define HAVE_SYS_TYPES_H 1\n#define HAVE_UNISTD_H 1\n#define HAVE_DECL_INFINITY 1\n#define HAVE_DECL_NAN 1\n#define HAVE_DECL_ISINF 1\n#define HAVE_DECL_ISNAN 1\n#define HAVE_DECL__ISNAN 1\n#define HAVE_DECL__FINITE 1\n#define SIZEOF_INT 4\n#define SIZEOF_INT64_T 8\n#define SIZEOF_LONG 4\n#define SIZEOF_LONG_LONG 8\n#define SIZEOF_SIZE_T 8\n#define SIZEOF_SSIZE_T 8\n#define JSON_C_VERSION \"0.19\"\n"], ["json.h", "#ifndef _json_h_\n#define _json_h_\n#include \"arraylist.h\"\n#include \"debug.h\"\n#include \"json_c_version.h\"\n#include \"json_object.h\"\n#include \"json_object_iterator.h\"\n#include \"json_patch.h\"\n#include \"json_pointer.h\"\n#include \"json_tokener.h\"\n#include \"json_util.h\"\n#include \"linkhash.h\"\n#endif\n"]]

