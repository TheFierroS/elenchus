# ---------------- cryptography, wave 1b ----------------
#
# Added after the 45-package split left val and test without any
# cryptography: mbedtls was the only crypto package, and one package can sit
# in only one split. Three more, independent implementations - so the same
# algorithm (ChaCha20, Poly1305, BLAKE2b, SHA-2) appears as different code in
# different packages, which is the generalisation the encoder must learn.

[[package]]
name = "libsodium"
domain = "crypto"
version = "1.0.22"
url = "https://github.com/jedisct1/libsodium/archive/refs/tags/1.0.22-RELEASE.tar.gz"
license = "ISC"
sources = ["src/libsodium/**/*.c"]                           # (~990)
include_dirs = ["src/libsodium/include", "src/libsodium/include/sodium"]
defines = ["SODIUM_STATIC", "SODIUM_DLL_EXPORT=", "NATIVE_LITTLE_ENDIAN"]
# autotools generates version.h; the MSVC build ships a ready copy.
copy = [["builds/msvc/version.h", "src/libsodium/include/sodium/version.h"]]
libs = ["advapi32"]                                          # RtlGenRandom

[[package]]
name = "libtomcrypt"
domain = "crypto"
version = "1.18.2"
url = "https://github.com/libtom/libtomcrypt/archive/refs/tags/v1.18.2.tar.gz"
license = "Unlicense"
# Public-key code needs a bignum library (libtommath) and does not compile
# without one. Symmetric ciphers, hashes, MACs, modes and PRNGs do.
sources = ["src/ciphers/**/*.c", "src/hashes/**/*.c", "src/mac/**/*.c",
           "src/encauth/**/*.c", "src/modes/**/*.c", "src/prngs/*.c",
           "src/stream/**/*.c", "src/misc/**/*.c"]           # (~580)
exclude = ["pk_get_oid.c"]                                   # public-key helper
include_dirs = ["src/headers"]
defines = ["LTC_NO_TEST"]

[[package]]
name = "monocypher"
domain = "crypto"
version = "4.0.2"
url = "https://github.com/LoupVaillant/Monocypher/archive/refs/tags/4.0.2.tar.gz"
license = "BSD-2-Clause"
sources = ["src/monocypher.c", "src/optional/monocypher-ed25519.c"]  # (~120)
include_dirs = ["src", "src/optional"]

# ---------------- wave 2 (17 September 2026) ----------------
#
# Added after the learning curve (docs/experiments.md, L): more packages
# help, and variety most. Each was compiled at -O0..-O3 in the sandbox with
# MinGW-w64 GCC 13 through build_package, its ground truth read, and no
# decl_file fell outside the package. The count on each is identities
# (decl_file, name) found at >= 2 levels there, before Ghidra matching and
# duplicate removal; build-corpus gives the real ones. Tried and left out:
# tinycbor and lzfse (62 and 22 identities after inlining) and openlibm (its
# per-architecture file lists need its Makefile).

[[package]]
name = "lexbor"
domain = "text"
version = "3.0.0"
url = "https://github.com/lexbor/lexbor/archive/refs/tags/v3.0.0.tar.gz"
license = "Apache-2.0"
# HTML, CSS, URL and encoding parsers. The posix and windows_nt ports share
# file names, so exclude cannot pick one: the modules are listed, with the
# windows_nt port. One package this large lands whole in one split - check
# where it goes before dataset --assign --force.
sources = ["source/lexbor/core/*.c", "source/lexbor/css/**/*.c", "source/lexbor/dom/**/*.c", "source/lexbor/encoding/*.c", "source/lexbor/engine/*.c", "source/lexbor/html/**/*.c", "source/lexbor/ns/*.c", "source/lexbor/punycode/*.c", "source/lexbor/selectors/**/*.c", "source/lexbor/style/**/*.c", "source/lexbor/tag/*.c", "source/lexbor/unicode/*.c", "source/lexbor/url/*.c", "source/lexbor/utils/*.c", "source/lexbor/ports/windows_nt/lexbor/core/*.c"]   # (~2642 at >= 2 levels, sandbox)
include_dirs = ["source"]
defines = ["LEXBOR_BUILDING"]

